name: Cierre Nocturno de Mora (11:59 PM CST)

on:
  schedule:
    # 05:59 UTC equivale a las 23:59 (11:59 PM) hora del Centro de México
    - cron: '59 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ejecutar-cierre:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del proyecto
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librerías
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl gdown

      - name: Ejecutar script de cierre
        run: python cierre_mora_nocturno.py

      - name: Guardar cambios automaticamente
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Auto-cierre de mora nocturno"
          file_pattern: "data/historial_mora.json"